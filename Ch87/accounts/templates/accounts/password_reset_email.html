{# The HTML version of the reset email, sent together with the plain text one (password_reset_email.txt). #}
{# Email programs ignore <style> and Bootstrap, so everything is a table with the styles written inline. #}
{# the full address of the page that sets the new password: the link is built here once and used twice below #}
{% url 'password_reset_confirm' uidb64=uid token=token as reset_path %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your Marketplace password</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6fb; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6fb; padding:32px 12px;">
        <tr>
            <td align="center">
                {# the card #}
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
                    {# top bar with the name of the site #}
                    <tr>
                        <td align="center" style="background-color:#212529; padding:22px 24px;">
                            <span style="color:#ffffff; font-size:22px; font-weight:bold; letter-spacing:0.5px;">Marketplace</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px 32px 8px 32px; color:#212529;">
                            <h1 style="margin:0 0 16px 0; font-size:22px; color:#212529;">Reset your password</h1>
                            <p style="margin:0 0 12px 0; font-size:15px; line-height:1.6; color:#495057;">Hello <strong>{{ user.username }}</strong>,</p>
                            <p style="margin:0 0 24px 0; font-size:15px; line-height:1.6; color:#495057;">
                                We got a request to reset the password of your Marketplace account.
                                Press the button to choose a new one.
                            </p>
                        </td>
                    </tr>
                    {# the button: a link styled like a button #}
                    <tr>
                        <td align="center" style="padding:0 32px 24px 32px;">
                            <a href="{{ protocol }}://{{ domain }}{{ reset_path }}"
                               style="display:inline-block; background-color:#212529; color:#ffffff; text-decoration:none; font-size:16px; font-weight:bold; padding:14px 32px; border-radius:8px;">
                                Reset password
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 32px 32px;">
                            <p style="margin:0 0 8px 0; font-size:13px; line-height:1.6; color:#6c757d;">
                                The button does not work? Copy this link into your browser:
                            </p>
                            <p style="margin:0 0 20px 0; font-size:12px; line-height:1.5; color:#0d6efd; word-break:break-all;">
                                {{ protocol }}://{{ domain }}{{ reset_path }}
                            </p>
                            <p style="margin:0; font-size:13px; line-height:1.6; color:#6c757d; border-top:1px solid #e9ecef; padding-top:16px;">
                                If you did not ask for this, just ignore this email. Your password stays the same.
                            </p>
                        </td>
                    </tr>
                </table>
                <p style="margin:16px 0 0 0; font-size:12px; color:#adb5bd;">Sent by Marketplace</p>
            </td>
        </tr>
    </table>
</body>
</html>

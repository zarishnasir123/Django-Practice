<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
</head>
<body>
    <h1>Students (students.html)</h1>

    {# template_name = 'myapp/students.html'; the rows still arrive as student_list #}
    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll</th>
            <th>Course</th>
        </tr>
        {% for student in student_list %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.roll }}</td>
            <td>{{ student.course }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No students yet.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>

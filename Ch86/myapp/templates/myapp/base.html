<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Students{% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {# the bar and the css link are written once here, every other template extends this file #}
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'studentlist' %}">Student CRUD</a>
            <a class="btn btn-success btn-sm" href="{% url 'studentcreate' %}">+ Add student</a>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock content %}
    </div>
</body>
</html>

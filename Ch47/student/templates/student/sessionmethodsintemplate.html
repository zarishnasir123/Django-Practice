<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Session Methods in Template</title>
</head>
<body>
    <h1>Session Methods in Template</h1>
    {% for key in keys %}
    {{key}} <br>
    {% endfor %}  <hr>

    {% for key,value in items %}
    {{key}} {{value}}  <br>
    {% endfor %} <hr>

    {{request.session.get_session_cookie_age}} <br>
    {{request.session.get_expiry_age}} <br>
    {{request.session.get_expiry_date}} <br>
    {{request.session.get_expire_at_browser_close}}  <br>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ student.name }}</title>
</head>
<body>
    <h1>Student Detail</h1>

    {# student = the one row the DetailView sends (object is the same thing) #}
    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <td>{{ student.id }}</td>
        </tr>
        <tr>
            <th>Name</th>
            <td>{{ student.name }}</td>
        </tr>
        <tr>
            <th>Roll</th>
            <td>{{ student.roll }}</td>
        </tr>
        <tr>
            <th>Course</th>
            <td>{{ student.course }}</td>
        </tr>
    </table>
</body>
</html>

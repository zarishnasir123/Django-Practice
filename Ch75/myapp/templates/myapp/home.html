<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <h1>Students</h1>
    <p>Total students: {{ total }}</p>
    <p>First student: {{ first }}</p>

    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.age }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No students yet. Add some in admin.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>

{% extends 'accounts/base.html' %}

{% block title %}Resend activation | AuthSystem{% endblock title %}

{% block content %}
<div class="mx-auto max-w-md rounded-2xl bg-navy-800 p-8 shadow-lg ring-1 ring-navy-700">
  <h1 class="text-2xl font-bold tracking-tight text-white">Resend activation</h1>
  <p class="mt-2 text-sm text-blue-200">Enter your email and we'll send you a new activation link.</p>

  <form method="post" class="mt-6 space-y-5">
    {% csrf_token %}

    <div>
      <label for="email" class="text-sm font-medium text-blue-100">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com" class="field">
    </div>

    <button type="submit" class="w-full rounded-xl bg-sky-500 px-5 py-2.5 text-sm font-semibold text-navy-950 shadow-sm transition hover:bg-sky-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-400">
      Send new link
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-blue-200">
    Remembered it?
    <a href="{% url 'login' %}" class="font-semibold text-sky-400 hover:text-sky-300">Back to Login</a>
  </p>
</div>
{% endblock content %}

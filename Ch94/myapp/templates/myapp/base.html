<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Login required middleware{% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Ch94</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'public' %}">Public page</a></li>
        </ul>
        {% if user.is_authenticated %}
        <span class="navbar-text me-3">{{ user.username }}</span>
        {# logout must be a POST form (LogoutView does not accept a plain link) #}
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
        </form>
        {% else %}
        <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light">Login</a>
        {% endif %}
    </div>
</nav>

<div class="container py-5">
    {% block content %}{% endblock content %}
</div>
</body>
</html>

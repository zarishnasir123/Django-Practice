<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card border-0 shadow mx-auto text-center" style="max-width: 500px;">
        <div class="card-body p-4">
            <h1 class="h3 fw-bold mb-3">Customer profile</h1>
            <p class="text-muted">namespace: <b>{{ request.resolver_match.namespace }}</b> | name: <b>{{ request.resolver_match.view_name }}</b></p>
            <div class="d-grid gap-2">
                <a href="{% url 'customer:dashboard' %}" class="btn btn-outline-dark">Dashboard</a>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary">Back to home</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>

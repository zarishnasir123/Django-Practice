{% extends 'accounts/base.html' %}

{% block title %}Delete product | AuthSystem{% endblock title %}

{% block content %}
<div class="mx-auto max-w-md rounded-2xl bg-navy-800 p-8 shadow-lg ring-1 ring-red-400/40">
  <h1 class="text-2xl font-bold tracking-tight text-white">Delete "{{ product.name }}"?</h1>
  <p class="mt-2 text-sm text-blue-200">This can't be undone.</p>

  <form method="post" class="mt-6 flex items-center gap-4">
    {% csrf_token %}
    <button type="submit" class="rounded-xl bg-red-500 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-red-400">Yes, delete</button>
    <a href="{% url 'product_list' %}" class="text-sm font-medium text-blue-200 hover:text-white">Cancel</a>
  </form>
</div>
{% endblock content %}

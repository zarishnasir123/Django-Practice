<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Django</title>
</head>
<body>
    <h1>Learn Django Template Language</h1>
    {% comment %} <h2>Name: {{name}}</h2> {% endcomment %}
    <h3>Course Details</h3>
    <li>
        <p>Course Name: {{name}}</p>
        <p>Duration: {{duration}}</p>
        <p>Total Seats: {{seats}}</p>
    </li>


    <p>Django is a high-level Python web framework that helps you build secure and maintainable websites quickly.</p>
</body>
</html>
